<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Cassa Sor Pippo</title>

<style>

body{
margin:0;
padding:15px;
font-family:Arial,sans-serif;
background:#efe4c8;
}

.header{
background:white;
padding:15px;
border-radius:12px;
text-align:center;
margin-bottom:15px;
}

.header h1{
margin:5px;
}

.btn{
width:100%;
padding:20px;
margin-bottom:10px;
font-size:24px;
border:none;
border-radius:12px;
color:white;
font-weight:bold;
}

.adulti{background:#1f4ea3;}
.bambini{background:#4aa3df;}
.panino{background:#b56a2d;}
.vino{background:#7a1f4d;}
.birra{background:#c99700;}

.box{
background:white;
padding:15px;
border-radius:12px;
margin-top:10px;
}

.riga{
display:flex;
justify-content:space-between;
align-items:center;
padding:8px 0;
border-bottom:1px solid #eee;
}

.minus{
background:#c62828;
color:white;
border:none;
border-radius:8px;
padding:6px 10px;
}

.totale{
font-size:32px;
font-weight:bold;
text-align:center;
margin-top:10px;
}

.action{
width:100%;
padding:14px;
margin-top:8px;
font-size:18px;
border:none;
border-radius:10px;
}

.green{
background:#2e7d32;
color:white;
}

.blue{
background:#1565c0;
color:white;
}

.red{
background:#c62828;
color:white;
}

.footer{
text-align:center;
margin-top:20px;
font-size:18px;
}

.modal{
position:fixed;
top:0;
left:0;
right:0;
bottom:0;
background:rgba(0,0,0,.5);
display:none;
justify-content:center;
align-items:center;
}

.modal-content{
background:white;
padding:20px;
border-radius:12px;
width:90%;
max-width:500px;
}

</style>
</head>

<body>

<div class="header">
<h1>🍷 LABICO IN FRASCA 2026</h1>
<h2>Fraschetta de Sor Pippo 'nPiazzetta</h2>
</div>

<button class="btn adulti" onclick="aggiungi('Menù Adulti',22)">
🍽️ MENÙ ADULTI €22
</button>

<button class="btn bambini" onclick="aggiungi('Menù Bambini',12)">
🧒 MENÙ BAMBINI €12
</button>

<button class="btn panino" onclick="aggiungi('Panino',5)">
🥖 PANINO €5
</button>

<button class="btn vino" onclick="aggiungi('Panino + Vino',6)">
🍷 PANINO + VINO €6
</button>

<button class="btn birra" onclick="aggiungi('Panino + Birra',10)">
🍺 PANINO + BIRRA €10
</button>

<div class="box">

<h3>Ordine Corrente</h3>

<div id="ordine"></div>

<div class="totale">
€ <span id="totale">0.00</span>
</div>

<button class="action green" onclick="riepilogo()">
🧾 RIEPILOGO ORDINE
</button>

<button class="action blue" onclick="ristampa()">
🔄 RISTAMPA ULTIMO
</button>

<button class="action blue" onclick="statistiche()">
📊 STATISTICHE
</button>

<button class="action red" onclick="azzera()">
❌ AZZERA
</button>

</div>

<div class="footer">

Ordine #
<span id="numeroOrdine"></span>

<br><br>

Incasso Totale €
<span id="incasso"></span>

</div>

<div class="modal" id="modal">
<div class="modal-content" id="contenutoModal"></div>
</div>

<script>

let quantita={};

let totale=0;

let incasso=parseFloat(
localStorage.getItem("incasso") || 0
);

let ordine=parseInt(
localStorage.getItem("ordine") || 1
);

let ultimoOrdine=
localStorage.getItem("ultimoOrdine") || "";

let stats=
JSON.parse(
localStorage.getItem("stats") || "{}"
);

render();

function salva(){

localStorage.setItem("incasso",incasso);
localStorage.setItem("ordine",ordine);
localStorage.setItem("ultimoOrdine",ultimoOrdine);
localStorage.setItem("stats",JSON.stringify(stats));

}

function aggiungi(nome,prezzo){

quantita[nome]=(quantita[nome]||0)+1;

totale+=prezzo;

render();

}

function togli(nome){

if(!quantita[nome]) return;

quantita[nome]--;

if(nome==="Menù Adulti") totale-=22;
if(nome==="Menù Bambini") totale-=12;
if(nome==="Panino") totale-=5;
if(nome==="Panino + Vino") totale-=6;
if(nome==="Panino + Birra") totale-=10;

if(quantita[nome]<=0){
delete quantita[nome];
}

render();

}

function render(){

let html='';

for(let voce in quantita){

html+=`
<div class="riga">
<span>${voce} x ${quantita[voce]}</span>
<button class="minus"
onclick="togli('${voce}')">
➖
</button>
</div>
`;

}

document.getElementById("ordine").innerHTML=
html || "Nessun prodotto";

document.getElementById("totale").innerText=
totale.toFixed(2);

document.getElementById("incasso").innerText=
incasso.toFixed(2);

document.getElementById("numeroOrdine").innerText=
ordine;

}

function azzera(){

quantita={};

totale=0;

render();

}

function riepilogo(){

if(totale===0){

alert("Ordine vuoto");

return;

}

let testo='';

for(let voce in quantita){

testo+=`
<div>${voce} x ${quantita[voce]}</div>
`;

}

document.getElementById("contenutoModal").innerHTML=`
<h2>Ordine #${ordine}</h2>

${testo}

<hr>

<h3>Totale € ${totale.toFixed(2)}</h3>

<button class="action green"
onclick="confermaOrdine()">
✅ CONFERMA
</button>

<button class="action red"
onclick="chiudiModal()">
❌ ANNULLA
</button>
`;

document.getElementById("modal").style.display="flex";

}

function chiudiModal(){

document.getElementById("modal").style.display="none";

}

function confermaOrdine(){

let testo=
"LABICO IN FRASCA 2026\n\n";

testo+=
"FRASCHETTA DE SOR PIPPO 'NPIAZZETTA\n\n";

testo+=
"ORDINE #" + ordine + "\n\n";

for(let voce in quantita){

testo+=
voce + " x " + quantita[voce] + "\n";

stats[voce]=(stats[voce]||0)+quantita[voce];

}

testo+=
"\nTOTALE € " + totale.toFixed(2);

ultimoOrdine=testo;

incasso+=totale;

ordine++;

salva();

azzera();

chiudiModal();

alert("Ordine registrato!");

}

function ristampa(){

if(!ultimoOrdine){

alert("Nessun ordine registrato");

return;

}

alert(ultimoOrdine);

}

function statistiche(){

let testo=
"ORDINI TOTALI: " + (ordine-1) +
"\n\n";

for(let voce in stats){

testo+=
voce + ": " + stats[voce] + "\n";

}

testo+=
"\nINCASSO € " +
incasso.toFixed(2);

alert(testo);

}

</script>

</body>
</html>
